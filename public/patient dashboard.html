<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
    .dashboard-container { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: #e9ecef; color: #343a40; position: fixed; height: 100%;
      display: flex; flex-direction: column; box-shadow: 1px 0 5px rgba(0,0,0,0.05);
    }
    .sidebar .nav-link { color: #495057; padding: 14px 20px; font-size: 1rem; }
    .sidebar .nav-link:hover { background: #dee2e6; }
    .sidebar .nav-link.active { background: #007bff; color: #fff; border-left: 4px solid #28a745; }
    .logout-link { margin-top: auto; border-top: 1px solid #ced4da; }
    .logout-link .nav-link { color: #dc3545; }
    .main-content { margin-left: 260px; padding: 25px; width: calc(100% - 260px); }
    .header-section {
      background: #fff; padding: 20px; margin-bottom: 25px; border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between;
    }
    .quick-action-card {
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
    }
    .quick-action-card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
    .upcoming-appointment-card {
      background: #e0f7fa; border-left: 5px solid #00acc1; padding: 20px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="p-4 text-center border-bottom">
        <img src="https://via.placeholder.com/80/007bff/FFFFFF?text=P" class="rounded-circle mb-2">
        <h5 class="fw-bold">Patient Portal</h5>
      </div>
      <nav class="nav flex-column">
        <a class="nav-link active" data-view="home"><i class="bi bi-house-door-fill me-2"></i>Dashboard</a>
        <a class="nav-link" data-view="appointments"><i class="bi bi-calendar-check-fill me-2"></i>Appointments</a>
        <a class="nav-link" data-view="records"><i class="bi bi-file-earmark-medical-fill me-2"></i>Records</a>
        <a class="nav-link" data-view="messages"><i class="bi bi-chat-dots-fill me-2"></i>Messages</a>
        <a class="nav-link" data-view="profile"><i class="bi bi-person-circle me-2"></i>Profile</a>
      </nav>
      <div class="logout-link">
        <a class="nav-link" id="logoutBtn" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content-area">
      <div class="header-section">
        <div>
          <h2>Hello, Jane Smith!</h2>
          <p>Welcome to your dashboard.</p>
        </div>
        <button class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Book Appointment</button>
      </div>

      <h4 class="mb-3 text-primary">Quick Actions</h4>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card quick-action-card p-3 text-center" data-action="appointments"><i class="bi bi-calendar-event fs-2 text-primary"></i><p>Appointments</p></div></div>
        <div class="col-md-3"><div class="card quick-action-card p-3 text-center" data-action="records"><i class="bi bi-file-medical fs-2 text-primary"></i><p>Records</p></div></div>
        <div class="col-md-3"><div class="card quick-action-card p-3 text-center" data-action="messages"><i class="bi bi-chat-text fs-2 text-primary"></i><p>Messages</p></div></div>
        <div class="col-md-3"><div class="card quick-action-card p-3 text-center" data-action="profile"><i class="bi bi-gear fs-2 text-primary"></i><p>Profile</p></div></div>
      </div>

      <h4 class="mb-3 text-primary">Next Appointment</h4>
      <div class="upcoming-appointment-card mb-4">
        <h5>Virtual Consultation with Dr. Alice Smith</h5>
        <p><b>Date:</b> Sep 30, 2025 <br><b>Time:</b> 10:00 AM - 10:30 AM</p>
        <button class="btn btn-success"><i class="bi bi-camera-video me-2"></i>Join Video Call</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script>
    // Logout
    function handleLogout(e) {
      e.preventDefault();
      if (confirm("Log out now?")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "login.html";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("logoutBtn").addEventListener("click", handleLogout);
    });
  </script>
</body>
</html>
