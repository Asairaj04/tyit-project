<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f0fa;
    }
    h2 {
      color: #6f42c1;
    }
    .btn-warning {
      background-color: #6f42c1;
      border-color: #6f42c1;
      color: #fff;
    }
    .btn-warning:hover {
      background-color: #5a32a3;
      border-color: #5a32a3;
      color: #fff;
    }
    .form-label {
      color: #4a1d96;
    }
  </style>
</head>
<body class="container mt-5">
  <h2>Doctor Registration</h2>
  <form id="doctorForm">
    <div class="mb-3">
      <label for="doctorName" class="form-label">Name</label>
      <input type="text" class="form-control" id="doctorName" placeholder="Name" required pattern="[A-Za-z\s]+" title="Name must contain only letters and spaces">
    </div>
    <div class="mb-3">
      <label for="doctorSpecialization" class="form-label">Specialization</label>
      <input type="text" class="form-control" id="doctorSpecialization" placeholder="Specialization" required>
    </div>
    <div class="mb-3">
      <label for="doctorEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="doctorEmail" placeholder="Email" required>
    </div>
    <div class="mb-3">
      <label for="doctorPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="doctorPassword" placeholder="Password"
             pattern="^(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$"
             title="Password must be at least 8 characters and include a special character (!@#$%^&*)"
             required>
    </div>
    <div class="mb-3">
      <label for="doctorConfirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="doctorConfirmPassword" placeholder="Confirm Password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="togglePassword">
      <label class="form-check-label" for="togglePassword">Show Password</label>
    </div>
    <button type="submit" class="btn btn-warning">Register</button>
  </form>

  <script>
    const form = document.getElementById("doctorForm");
    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.getElementById("doctorPassword");
    const confirmPasswordField = document.getElementById("doctorConfirmPassword");

    togglePassword.addEventListener("change", () => {
      const type = togglePassword.checked ? "text" : "password";
      passwordField.type = type;
      confirmPasswordField.type = type;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("doctorName").value;
      const specialization = document.getElementById("doctorSpecialization").value;
      const email = document.getElementById("doctorEmail").value;
      const password = passwordField.value;
      const confirmPassword = confirmPasswordField.value;

      if (password !== confirmPassword) {
        alert("Password do not match");
        return;
      }

      try {
        const res = await fetch("http://localhost:3000/register-doctor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, specialization, email, password })
        });

        const data = await res.json();
        alert(data.message);
        form.reset();
      } catch (error) {
        console.error(error);
        alert("Error registering doctor");
      }
    });
  </script>
</body>
</html>
