<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f0fa;
    }
    h2 {
      color: #6f42c1;
    }
    .btn-success {
      background-color: #6f42c1;
      border-color: #6f42c1;
    }
    .btn-success:hover {
      background-color: #5a32a3;
      border-color: #5a32a3;
    }
    .form-label {
      color: #4a1d96;
    }
  </style>
</head>
<body class="container mt-5">
  <h2>Patient Registration</h2>
  <form id="patientForm">
    <div class="mb-3">
      <label for="patientName" class="form-label">Name</label>
      <input type="text" class="form-control" id="patientName" required
             pattern="[A-Za-z\s]+" title="Name must contain only letters and spaces">
    </div>
    <div class="mb-3">
      <label for="patientAddress" class="form-label">Address</label>
      <input type="text" class="form-control" id="patientAddress" required>
    </div>
    <div class="mb-3">
      <label for="patientEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="patientEmail" required>
    </div>
    <div class="mb-3">
      <label for="patientPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="patientPassword" required
             pattern="^(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$"
             title="Password must be at least 8 characters and include a special character (!@#$%^&*)">
    </div>
    <div class="mb-3">
      <label for="patientConfirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="patientConfirmPassword" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="togglePassword">
      <label class="form-check-label" for="togglePassword">Show Password</label>
    </div>
    <button type="submit" class="btn btn-success">Register</button>
  </form>

  <script>
    const form = document.getElementById("patientForm");
    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.getElementById("patientPassword");
    const confirmPasswordField = document.getElementById("patientConfirmPassword");

    togglePassword.addEventListener("change", () => {
      const type = togglePassword.checked ? "text" : "password";
      passwordField.type = type;
      confirmPasswordField.type = type;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("patientName").value;
      const address = document.getElementById("patientAddress").value;
      const email = document.getElementById("patientEmail").value;
      const password = passwordField.value;
      const confirmPassword = confirmPasswordField.value;

      if (/\d/.test(name)) {
        alert("O nome não deve conter números!");
        return;
      }

      if (password !== confirmPassword) {
        alert("As senhas não coincidem!");
        return;
      }

      try {
        const res = await fetch("http://localhost:3000/register_patient", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, address, email, password })
        });

        const data = await res.json();
        alert(data.message);
        form.reset();
      } catch (error) {
        console.error(error);
        alert("Erro ao registrar paciente");
      }
    });
  </script>
</body>
</html>
