<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f3f0f9;
    }
    .card-header {
      background-color: #6f42c1;
    }
    .btn-purple {
      background-color: #6f42c1;
      color: white;
    }
    .btn-purple:hover {
      background-color: #5a379e;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header text-center text-white">
            <h3>Login</h3>
          </div>
          <div class="card-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email address</label>
                <input type="email" class="form-control" id="loginEmail" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="loginPassword" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
                </div>
              </div>
              <button type="submit" class="btn btn-purple w-100">Login</button>
            </form>
            <div id="loginMessage" class="mt-3 text-center"></div>
          </div>
          <div class="card-footer text-center">
            <small>Don't have an account? <a href="register.html">Register here</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const messageDiv = document.getElementById("loginMessage");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("loginPassword");
    const emailInput = document.getElementById("loginEmail");

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      togglePassword.textContent = type === "password" ? "Show" : "Hide";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value;
      const password = passwordInput.value;

      try {
        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<span class="text-success">${data.message}</span>`;

          // Clear input fields
          emailInput.value = "";
          passwordInput.value = "";

          // Redirect based on role id (rid)
          if (data.user.rid === 1) {
            window.location.href = "doctor dashboard.html";
          } else if (data.user.rid === 2) {
            window.location.href = "receptionist dashboard.html";
          } else if (data.user.rid === 3) {
            window.location.href = "patient dashboard.html";
          } else {
            messageDiv.innerHTML = `<span class="text-danger">Unknown role.</span>`;
          }
        } else {
          messageDiv.innerHTML = `<span class="text-danger">${data}</span>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<span class="text-danger">Server error. Try again later.</span>`;
      }
    });
  </script>
</body>
</html>
